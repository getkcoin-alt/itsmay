# Railway deploy config. Linked from project root.
# Postgres + Redis are provisioned as separate Railway plugins; their
# DATABASE_URL and REDIS_URL are injected into this service automatically.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Liveness only (no upstream calls) so a rate-limited/cooling-down key can't fail
# the healthcheck and trigger a restart loop (#19). /v1/health stays the deep
# readiness check for humans + monitoring.
healthcheckPath = "/v1/live"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
