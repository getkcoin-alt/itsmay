# Local / single-host deployment of the Kairos simulated trading demo.
#   cp .env.example .env   # set KAIROS_ADMIN_PASSWORD at minimum
#   docker compose up -d --build   →  http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairos}
      POSTGRES_DB: kairos
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
  api:
    build: ./backend
    environment:
      KAIROS_ENV: production
      KAIROS_DATABASE_URL: postgresql+psycopg://kairos:${POSTGRES_PASSWORD:-kairos}@db:5432/kairos
      KAIROS_REDIS_URL: redis://redis:6379/0
      KAIROS_ADMIN_PASSWORD: ${KAIROS_ADMIN_PASSWORD:?set KAIROS_ADMIN_PASSWORD in .env}
      KAIROS_COOKIE_SECURE: ${KAIROS_COOKIE_SECURE:-false}
      KAIROS_EXPOSE_RESET_LINKS: ${KAIROS_EXPOSE_RESET_LINKS:-false}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  web:
    build:
      context: ./frontend
      args: { KAIROS_API_ORIGIN: http://api:8000 }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
