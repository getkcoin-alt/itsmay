[project]
name = "vault-zeta"
version = "0.1.0"
description = "Vault Zeta Node SSN-92C — Scrappy Singh, sovereign personal AI operator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    "fastembed>=0.4",
]

[project.optional-dependencies]
# Server doesn't need either of these in the default cloud-STT path.
whisper_local = ["faster-whisper>=1.0"]      # only if STT_PROVIDER=local
mac = ["sounddevice>=0.5"]                   # only for the Mac voice agent

dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "apps*"]
exclude = ["infra*", "tests*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
