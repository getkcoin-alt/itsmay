[project]
name = "vault-zeta"
version = "0.2.0"
description = "Vault Zeta Node SSN-92C — Scrappy Singh, sovereign personal AI operator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    "fastembed>=0.4",
    "pyyaml>=6.0",
    "redis[hiredis]>=5.0",
    "mcp>=2.0,<3",
    # Imported directly by core/voice/tts_elevenlabs.py for ElevenLabs'
    # stream-input socket. uvicorn[standard] happens to pull it in too, but a
    # direct import deserves a direct declaration.
    "websockets>=13.0",
]

[project.scripts]
scrappy = "apps.cli:main"
scrappy-continuity = "apps.cli.continuity:main"
mini = "apps.mini:main"

[project.optional-dependencies]
# Server doesn't need either of these in the default cloud-STT path.
whisper_local = ["faster-whisper>=1.0"]      # only if STT_PROVIDER=local
# Mac voice agent. webrtcvad-wheels ships prebuilt wheels (no C compiler needed,
# unlike plain `webrtcvad`); it's optional — the loop falls back to a pure-Python
# energy VAD if it's absent, so voice stays hands-free either way.
mac = ["sounddevice>=0.5", "webrtcvad-wheels>=2.0.14"]
# Mini AI — the fully-local voice companion. Heavy: resemblyzer pulls in torch for
# voiceprint speaker-ID; piper-tts is the offline voice. Only needed on a device
# that runs `mini`, never on the server.
mini = [
    "sounddevice>=0.5",
    "webrtcvad-wheels>=2.0.14",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "resemblyzer>=0.1.4",
]
gmail = [                                    # Gmail connector (set GOOGLE_CREDENTIALS_JSON)
    "google-api-python-client>=2.140",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
]
# Private continuity archives. Kept optional so the production API does not pull
# crypto code unless the operator uses encrypted backup/restore on that host.
continuity = ["cryptography>=43"]

dev = [
    # Pinned exactly, on purpose. A floating ruff means a new release can add
    # rules and turn `main` red without a line of code changing — which is how
    # the lint baseline silently drifted to 114 findings once already. Bump it
    # deliberately, with the fixes in the same commit.
    "ruff==0.17.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "apps*"]
exclude = ["infra*", "tests*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The long line is embedded AppleScript inside a Python string; a `# noqa`
# there would become part of the script, and wrapping it risks the one thing
# that cannot be tested off a Mac.
"apps/mac_agent/chrome.py" = ["E501"]
# A standalone script: it puts the repo root on sys.path and loads .env before
# importing anything from `core`, which is the whole point of the ordering.
"scripts/seed_memory.py" = ["E402"]
# The Mac voice client is a single-user local CLI with no concurrent requests
# to starve: blocking file reads, `input()` prompts and a sleep-poll loop are
# deliberate simplicity there, not latency bugs.
"apps/mac_agent/voice_loop.py" = ["ASYNC110", "ASYNC230", "ASYNC240", "ASYNC250"]
"apps/cli/__init__.py" = ["ASYNC250"]

# B008 flags function calls in argument defaults — but that IS the FastAPI
# dependency-injection idiom (`x: T = Depends(...)`), and these factories are
# evaluated per-request by FastAPI, not once at import. ruff 0.17 dropped them
# from its built-in allowlist, so name them here.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
