name: SYNCBOND v5 Contract

on:
  pull_request:
  push:
    branches:
      - architecture/syncbond-v5

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint restored Mini contracts
        run: >-
          ruff check
          core/companion/emotion_stream.py
          core/companion/tenants.py
          core/companion/voice_features.py
          tests/test_mini_missing_contracts.py
      - run: pytest -q
