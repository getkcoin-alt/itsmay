name: Continuity Capsule CI

on:
  push:
    branches:
      - "scrappy/continuity-capsule-v1"
  pull_request:
    paths:
      - "core/vault/continuity.py"
      - "core/vault/continuity_crypto.py"
      - "core/vault/transport.py"
      - "apps/api/routers/vault.py"
      - "tests/test_continuity_capsule.py"
      - "tests/test_vault_transport.py"
      - "pyproject.toml"
      - "docs/CONTINUITY_CAPSULE.md"
      - ".github/workflows/continuity-capsule.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -e ".[dev,continuity]"
      - name: Import API
        run: |
          python -c "import apps.api.main; print('api import ok')"
      - name: Targeted tests
        run: |
          pytest -q tests/test_continuity_capsule.py tests/test_vault_transport.py
      - name: Ruff
        run: |
          ruff check core/vault/continuity.py core/vault/continuity_crypto.py core/vault/transport.py apps/api/routers/vault.py tests/test_continuity_capsule.py tests/test_vault_transport.py
