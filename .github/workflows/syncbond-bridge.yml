name: SYNCBOND Bridge

on:
  pull_request:
  push:
    branches:
      - architecture/syncbond-v5

permissions:
  contents: read

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pytest -q
          tests/test_syncbond_contract.py
          tests/test_scrappy_os_connector.py
          tests/test_syncbond_experiences.py
          tests/test_syncbond_evidence_bundle.py
          tests/test_syncbond_promotion_records.py
